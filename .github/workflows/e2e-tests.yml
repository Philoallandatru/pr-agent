name: E2E Integration Tests

on:
  push:
    branches: [ main, auto-review ]
  pull_request:
    branches: [ main, auto-review ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-xdist httpx

    - name: Create test directories
      run: |
        mkdir -p tests/e2e
        mkdir -p test-results
        mkdir -p coverage-reports

    - name: Run E2E tests
      env:
        TESTING: true
        DATABASE_URL: sqlite:///test.db
        REDIS_URL: redis://localhost:6379
        LOG_LEVEL: INFO
      run: |
        pytest tests/e2e/ \
          -v \
          --tb=short \
          --cov=pr_agent \
          --cov-report=xml:coverage-reports/coverage.xml \
          --cov-report=html:coverage-reports/html \
          --cov-report=term-missing \
          --junitxml=test-results/junit.xml \
          -n auto

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results/

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: coverage-reports-${{ matrix.python-version }}
        path: coverage-reports/

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage-reports/coverage.xml
        flags: e2e-tests
        name: e2e-coverage

    - name: Comment PR with test results
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const junit = fs.readFileSync('test-results/junit.xml', 'utf8');
          // Parse and comment with results
          console.log('Test results uploaded');

  performance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest pytest-benchmark locust

    - name: Run performance tests
      env:
        TESTING: true
      run: |
        pytest tests/e2e/test_performance.py \
          -v \
          --benchmark-only \
          --benchmark-json=performance-results.json

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: performance-results.json

  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest bandit safety

    - name: Run security tests
      env:
        TESTING: true
      run: |
        pytest tests/e2e/test_security.py -v

    - name: Run Bandit security scan
      run: |
        bandit -r pr_agent/ -f json -o security-report.json || true

    - name: Run Safety check
      run: |
        safety check --json > safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          security-report.json
          safety-report.json

  integration-summary:
    runs-on: ubuntu-latest
    needs: [e2e-tests, performance-tests, security-tests]
    if: always()

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Generate summary report
      run: |
        echo "# E2E Integration Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "- E2E Tests: ${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Performance Tests: ${{ needs.performance-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Security Tests: ${{ needs.security-tests.result }}" >> $GITHUB_STEP_SUMMARY

    - name: Check if all tests passed
      if: |
        needs.e2e-tests.result != 'success' ||
        needs.performance-tests.result != 'success' ||
        needs.security-tests.result != 'success'
      run: |
        echo "Some tests failed!"
        exit 1
