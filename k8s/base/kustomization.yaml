apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pr-agent

resources:
- namespace.yaml
- configmap.yaml
- secret.yaml
- rbac.yaml
- pvc.yaml
- deployment.yaml
- service.yaml
- ingress.yaml
- hpa.yaml
- redis.yaml

commonLabels:
  app.kubernetes.io/name: pr-agent
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/managed-by: kustomize

images:
- name: pr-agent
  newName: ghcr.io/philoallandatru/pr-agent
  newTag: latest
