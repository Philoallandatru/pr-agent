apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pr-agent-data
  namespace: pr-agent
  labels:
    app: pr-agent
    component: storage
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pr-agent-tokenizers
  namespace: pr-agent
  labels:
    app: pr-agent
    component: storage
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pr-agent-repos
  namespace: pr-agent
  labels:
    app: pr-agent
    component: storage
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: standard
