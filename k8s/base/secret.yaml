apiVersion: v1
kind: Secret
metadata:
  name: pr-agent-secrets
  namespace: pr-agent
type: Opaque
stringData:
  # Bitbucket Server credentials
  BITBUCKET_TOKEN: "changeme"

  # JWT secret key for authentication
  PR_AGENT_SECRET_KEY: "changeme-generate-secure-key"

  # Admin password
  PR_AGENT_ADMIN_PASSWORD: "changeme-secure-password"

  # Redis password (if required)
  REDIS_PASSWORD: ""

  # Database encryption key
  DB_ENCRYPTION_KEY: "changeme-encryption-key"
