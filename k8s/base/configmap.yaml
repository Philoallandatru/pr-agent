apiVersion: v1
kind: ConfigMap
metadata:
  name: pr-agent-config
  namespace: pr-agent
data:
  configuration.toml: |
    [config]
    model = "gpt-4o"
    git_provider = "bitbucket_server"

    [tokenizer]
    enable_local_cache = true
    fallback_to_download = false
    local_cache_dir = "/app/tokenizers"

    [bitbucket_server]
    enable_polling = true
    polling_interval_seconds = 300
    max_parallel_tasks = 10

    [repo_context]
    enable_full_context = true
    clone_depth = 1
    clone_cache_dir = "/app/repos"
    max_related_files = 20
    max_context_tokens = 10000

    [web_platform]
    host = "0.0.0.0"
    port = 8000

    [cache]
    enabled = true
    backend = "redis"
    redis_host = "redis"
    redis_port = 6379

    [webhook]
    enabled = true
    timeout = 10
    retry_count = 3

    [monitoring]
    enabled = true
    prometheus_port = 9090
