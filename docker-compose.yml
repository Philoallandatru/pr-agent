version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr-agent-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - tokenizer-cache:/data/tokenizers
      - repo-cache:/data/repos
      - db-data:/data/db
      - polling-state:/data/state
      - ./pr_agent.toml:/app/.pr_agent.toml:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PR_AGENT_CONFIG_FILE=/app/.pr_agent.toml
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-secret-key-in-production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
    networks:
      - pr-agent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  polling:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr-agent-polling
    restart: unless-stopped
    command: python -m pr_agent.servers.bitbucket_server_polling
    volumes:
      - tokenizer-cache:/data/tokenizers
      - repo-cache:/data/repos
      - polling-state:/data/state
      - ./pr_agent.toml:/app/.pr_agent.toml:ro
    environment:
      - PYTHONUNBUFFERED=1
      - PR_AGENT_CONFIG_FILE=/app/.pr_agent.toml
    networks:
      - pr-agent-network
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pr-agent-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - pr-agent-network
    depends_on:
      - backend

volumes:
  tokenizer-cache:
    driver: local
  repo-cache:
    driver: local
  db-data:
    driver: local
  polling-state:
    driver: local

networks:
  pr-agent-network:
    driver: bridge
