services:
  pr-agent-polling:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pr-agent-bitbucket-polling
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PR_AGENT_CONFIG_FILE: /app/.pr_agent.toml
      PR_AGENT_LOG_FORMAT: ${PR_AGENT_LOG_FORMAT:-CONSOLE}
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./.pr_agent.toml:/app/.pr_agent.toml:ro
      - polling-state:/data/state
      - repo-cache:/data/repos
      - tokenizer-cache:/data/tokenizers

volumes:
  polling-state:
  repo-cache:
  tokenizer-cache:
